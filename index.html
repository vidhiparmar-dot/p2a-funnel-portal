.main{max-width:1400px;margin:0 auto;padding:20px}
.stats{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1px solid #E4E8F0;border-radius:8px;padding:12px 8px;text-align:center;cursor:pointer;transition:all .15s;user-select:none}

.sn{font-size:22px;font-weight:700;line-height:1;margin-bottom:3px}
.sl{font-size:10px;color:#6B7A99;line-height:1.3}
.fbar{display:flex;height:6px;border-radius:3px;overflow:hidden;gap:2px;margin-bottom:12px}
.fbar div{border-radius:3px}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.tc{background:#fff;border:1px solid #E4E8F0;border-radius:8px;padding:14px 16px;display:flex;align-items:center;gap:12px}
.tdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.tlbl{font-size:10px;color:#6B7A99;font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px}
.tnum{font-size:20px;font-weight:700;color:#0F1629}
.tbadges{margin-left:auto;display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.filters{background:#fff;border:1px solid #E4E8F0;border-radius:8px;padding:12px 14px;margin-bottom:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,select{border:1px solid #E4E8F0;border-radius:7px;padding:6px 10px;font-size:12px;font-family:inherit;color:#0F1629;background:#F7F8FC;outline:none}
input:focus,select:focus{border-color:#E8580A}
input{flex:1;min-width:130px}
button{border:1px solid #E4E8F0;border-radius:7px;padding:6px 12px;font-size:11px;font-family:inherit;background:#F7F8FC;color:#6B7A99;cursor:pointer}
button:hover{background:#FEF2F2;border-color:#FECACA;color:#991B1B}
.cnt{font-size:11px;color:#6B7A99;margin-left:auto;white-space:nowrap}
.tw{background:#fff;border:1px solid #E4E8F0;border-radius:8px;overflow:hidden}
table{width:100%;border-collapse:collapse;table-layout:fixed}
thead tr{background:#0F1629}
th{padding:10px 12px;text-align:left;font-size:10px;font-weight:600;color:rgba(255,255,255,0.55);text-transform:uppercase;letter-spacing:.07em;white-space:nowrap}
tbody tr{border-bottom:1px solid #F0F2F8}
tbody tr:hover{background:#F5F7FF}
td{padding:9px 12px;vertical-align:middle}
.t1{color:#9CA3AF;font-size:11px}
.t2{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.t4{color:#6B7A99;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:100px;font-size:10.5px;font-weight:600;border:1px solid;white-space:nowrap}
.dot{width:5px;height:5px;border-radius:50%;display:inline-block}
.pill{padding:1px 7px;border-radius:4px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.ind-badge{padding:2px 8px;border-radius:4px;font-size:10.5px;font-weight:600;white-space:nowrap;display:inline-block}
.empty{text-align:center;padding:50px;color:#6B7A99}

function normAM(s){s=(s||"").trim();if(!s||s==="—")return"";if(/bijal/i.test(s))return"Bijal Panchmatiya";return s;}
function normType(s){s=(s||"").toLowerCase();if(s.includes("paid"))return"paid";if(s.includes("top"))return"top";if(s.includes("other"))return"other";return"other";}
function normStatus(s){s=(s||"").trim().toLowerCase();if(!s||s==="—")return"notreach";if(s==="live")return"live";if(s==="uat")return"uat";if(s.includes("dev"))return"dev";if(s.includes("approval"))return"approved";if(s.includes("discussion")||s.includes("meeting")||s==="interested")return"conv";if(s==="pitched")return"pitched";if(s.includes("declined")||s.includes("let it go")||s.includes("not interested")||s.includes("hold"))return"declined";return"notreach";}

function splitCSV(line){const r=[];let c="",q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"')q=!q;else if(ch===','&&!q){r.push(c);c="";}else c+=ch;}r.push(c);return r.map(x=>x.trim().replace(/^"|"$/g,""));}

function parseAndLoad(text){
  const lines=text.split(/\r?\n/).map(l=>l.trimEnd());
  let hi=0;
  for(let i=0;i<Math.min(5,lines.length);i++){if(lines[i].toLowerCase().includes("type of incentive")){hi=i;break;}}
  const hd=splitCSV(lines[hi]).map(h=>h.toLowerCase());
  // detect brand column — could be 'client' or 'parent organization name'
  const cb=hd.findIndex(h=>h.includes("parent organization")||h==="client");
  const ct=hd.findIndex(h=>h.includes("type of incentive"));
  const ca=hd.findIndex(h=>h.includes("p2a am"));
  const cs=hd.findIndex(h=>h.includes("status"));
  const cm=hd.findIndex(h=>h.includes("account manager"));
  const parsed=[];
  for(let i=hi+1;i<lines.length;i++){
    const c=splitCSV(lines[i]);
    const brand=(c[cb]||"").trim();
    if(!brand||brand==="—"||brand.length<2||brand==="Account Manager"||brand==="Grand Total")continue;
    const ind=INDUSTRY_MAP[brand]||["",""];
    parsed.push({b:brand,t:normType(c[ct]||""),a:normAM(c[ca]||c[cm]||""),s:normStatus(c[cs]||""),i:ind[0],si:ind[1]});
  }
  return parsed;
}

function handleCSV(input){
  const file=input.files[0];
  if(!file)return;
  const st=document.getElementById("uploadStatus");
  st.textContent="Reading…";st.style.color="#6B7A99";
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const parsed=parseAndLoad(e.target.result);
      if(!parsed.length)throw new Error("No brands found — check the file");
      // replace DATA in place
      DATA.length=0;
      parsed.forEach(r=>DATA.push(r));
      // update header count
      document.querySelector(".hdr span:last-child").textContent=`${DATA.length} brands · Combined TAL · Updated ${new Date().toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})}`;
      clr();
      st.textContent=`✅ ${DATA.length} brands loaded from ${file.name}`;
      st.style.color="#15803D";
    }catch(err){
      st.textContent=`❌ Error: ${err.message}`;st.style.color="#991B1B";
    }
    input.value="";
  };
  reader.readAsText(file);
}

function init(){
  const ct={total:DATA.length};Object.keys(SC).forEach(k=>ct[k]=0);DATA.forEach(r=>ct[r.s]++);
  const byT={};DATA.forEach(r=>{if(!byT[r.t])byT[r.t]={total:0};byT[r.t].total++;byT[r.t][r.s]=(byT[r.t][r.s]||0)+1;});
  document.getElementById("stats").innerHTML=ST.map(([k,l,c,bc])=>`<div class="stat" style="border-top:2px solid ${bc};color:${c}" onclick="statFilter('${k}')" title="Click to filter by ${l}"><div class="sn" style="color:${c}">${ct[k]||0}</div><div class="sl">${l}</div></div>`).join("");
  document.getElementById("fbar").innerHTML=Object.entries(SC).map(([k,c])=>ct[k]>0?`<div style="flex:${ct[k]};background:${c.d}" title="${c.l}: ${ct[k]}"></div>`:"").join("");
  // Expected incentive calc — deduplicate brands across types
  const RATE={paid:9000,top:9000,other:3000};
  const activeStatuses=["live","uat","dev"];
  // Get unique brand names that are active, pick highest-value type per brand
  const brandBestType={};
  DATA.forEach(r=>{
    if(!activeStatuses.includes(r.s))return;
    const prev=brandBestType[r.b];
    if(!prev){brandBestType[r.b]=r.t;return;}
    // prefer paid > top > other
    const rank={paid:3,top:2,other:1};
    if((rank[r.t]||0)>(rank[prev]||0))brandBestType[r.b]=r.t;
  });
  const incentiveByType={paid:0,top:0,other:0};
  Object.entries(brandBestType).forEach(([b,t])=>incentiveByType[t]=(incentiveByType[t]||0)+RATE[t]);

  const totalInc=Object.values(incentiveByType).reduce((a,b)=>a+b,0);
  const totalActive=Object.keys(brandBestType).length;
  const toK=v=>v>=1000?`$${(v/1000).toFixed(0)}K`:`$${v}`;
  document.getElementById("incTotal").textContent="";
  const typeCards=Object.entries(TC).map(([tk,tc])=>{
    const d=byT[tk]||{};
    const pos=["live","uat","dev"].filter(k=>d[k]>0);
    const inc=incentiveByType[tk]||0;
    const incStr=inc>0?`<div style="font-size:11px;color:#15803D;font-weight:600;margin-top:4px">${toK(inc)} exp.</div>`:"";
    return`<div class="tc"><div class="tdot" style="background:${tc.d}"></div><div><div class="tlbl">${tc.l}</div><div class="tnum">${d.total||0}</div>${incStr}</div><div class="tbadges">${pos.map(k=>`<span class="badge" style="border-color:${SC[k].bd};background:${SC[k].bg};color:${SC[k].c};font-size:10px;padding:1px 6px"><span class="dot" style="background:${SC[k].d}"></span>${SC[k].l} ${d[k]}</span>`).join("")}</div></div>`;
  });
  // Total incentive card
  const totalCard=`<div class="tc" style="background:#F0FDF4;border-color:#BBF7D0"><div class="tdot" style="background:#15803D"></div><div><div class="tlbl" style="color:#15803D">Total Incentive</div><div class="tnum" style="color:#15803D">${toK(totalInc)}</div><div style="font-size:10px;color:#15803D;margin-top:2px">${totalActive} brands · deduplicated</div></div></div>`;
  document.getElementById("types").innerHTML=[...typeCards,totalCard].join("");
  const inds=[...new Set(DATA.map(r=>r.i).filter(Boolean))].sort();
  document.getElementById("fi").innerHTML='<option value="">All industries</option>'+inds.map(i=>`<option value="${i}">${i}</option>`).join("");
  const ams=[...new Set(DATA.map(r=>r.a).filter(Boolean))].sort();
  document.getElementById("fa").innerHTML='<option value="">All AMs</option>'+ams.map(a=>`<option value="${a}">${a}</option>`).join("");
  go();
}

function statFilter(k){

  });
  document.getElementById("cnt").textContent=fil.length+" of "+DATA.length+" brands";
  const tb=document.getElementById("tbody"),em=document.getElementById("empty");
  if(!fil.length){tb.innerHTML="";em.style.display="block";return;}
  em.style.display="none";
  tb.innerHTML=fil.map((r,i)=>`<tr><td class="t1">${i+1}</td><td class="t2" title="${r.b}">${r.b}</td><td>${pll(r.t)}</td><td>${ibdg(r.i)}</td><td style="font-size:11px;color:#6B7A99">${r.si||"—"}</td><td class="t4" title="${r.a||""}">${r.a||"—"}</td><td>${bdg(r.s)}</td></tr>`).join("");
}
function clr(){document.getElementById("si").value="";["ft","fs","fi","fsi","fa"].forEach(id=>document.getElementById(id).value="");document.querySelectorAll(".stat").forEach(s=>s.classList.remove("active"));updateSubFilter();go();}
init();
</script>
